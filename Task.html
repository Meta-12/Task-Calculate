
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ខ្ជិលកែ PMP ណាស់</title>
  <link rel="shortcut icon" href="image.png" type="image/x-icon">

  <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
      <div style="text-align: center; font-size: 50px; font-weight: bold;font-family:khmer os;">
        ខ្ជិលកែ​ PMP ណាស់
      </div>

    <div class="header">
      <div class="header-icon">✓</div>

      <h1>Task Calculator</h1>

      <p class="subtitle">
        Calculate your task performance and peer review time
      </p>
    </div>


    <!-- INPUT FORM -->

    <div class="form-grid">

      <div class="input-group">
        <label>Total (Tasks + Peer Review)</label>
        <input
          type="number"
          id="totalTasks"
          placeholder="100"
          min="1"
        >
      </div>

      <div class="input-group">
        <label>Completed Tasks</label>
        <input
          type="number"
          id="completedTasks"
          placeholder="34"
          min="0"
        >
      </div>

      <div class="input-group">
        <label>Total Hours</label>
        <input
          type="number"
          id="totalHours"
          placeholder="8"
          min="0"
        >
      </div>

      <div class="input-group">
        <label>Total Minutes</label>
        <input
          type="number"
          id="totalMinutes"
          placeholder="30"
          min="0"
          max="59"
        >
      </div>

    </div>


    <button onclick="calculate()">
      Calculate Performance
    </button>


    <!-- RESULTS -->

    <div class="results" id="results">

      <h2>📊 Results</h2>

      <div class="result-grid">

         <div class="result-card">
          <div class="result-label">
            Total Available Time
          </div>

          <div class="result-value small" id="totalTime">
            -
          </div>
        </div>

        <div class="result-card">
          <div class="result-label">
            Tasks Per Hour
          </div>

          <div class="result-value" id="tasksPerHour">
            -
          </div>
        </div>


        <div class="result-card">
          <div class="result-label">
            Completed Tasks
          </div>

          <div class="result-value" id="completedResult">
            -
          </div>
        </div>


        <div class="result-card">
          <div class="result-label">
            Peer Review Tasks
          </div>

          <div class="result-value" id="peerReviewTasks">
            -
          </div>
        </div>


        <div class="result-card highlight">
          <div class="result-label">
            Completed Task Time
          </div>

          <div class="result-value small" id="completedTime">
            -
          </div>
        </div>


        <div class="result-card highlight">
          <div class="result-label">
            Peer Review Time
          </div>

          <div class="result-value small" id="peerReviewTime">
            -
          </div>
        </div>


       

      </div>

    </div>


    <div class="footer">
      Task Performance Calculator
    </div>

  </div>


<script src="run.js"></script>

</body>
</html>
